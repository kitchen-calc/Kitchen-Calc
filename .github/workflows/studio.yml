# Собирает установщик программы Kitchen Calc Studio для Windows и выкладывает его в Releases.
# Последняя версия всегда здесь: https://github.com/kitchen-calc/Kitchen-Calc/releases/latest
name: Build Kitchen Calc Studio

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/studio.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Version 1.0.<run number>
        run: npm pkg set version=1.0.${{ github.run_number }}
      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v1.0.${{ github.run_number }}
          name: Kitchen Calc Studio 1.0.${{ github.run_number }}
          body: |
            Установщик программы Kitchen Calc Studio для Windows — скачайте файл KitchenCalcStudio-Setup-….exe ниже.
            Windows может предупредить «Система Windows защитила ваш компьютер»: нажмите «Подробнее» → «Выполнить в любом случае».
          files: desktop/dist/*.exe
          make_latest: true
