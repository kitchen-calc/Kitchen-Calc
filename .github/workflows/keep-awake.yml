# Будит сайт на Render, чтобы бесплатный сервер не засыпал (он засыпает после ~15 минут без заходов).
# GitHub запускает расписание с опозданием (паузы между запусками доходили до 30+ минут), поэтому
# один запуск сам пингует сайт каждые 4 минуты примерно полчаса — так промежуток между пингами
# не больше ~4 минут, даже если следующий запуск задержится. Новый запуск сменяет предыдущий.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут (время GitHub может сдвигать)
  workflow_dispatch:          # ручной запуск: вкладка Actions → Keep site awake → Run workflow

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Ping /health every 4 minutes
        run: |
          failed=0
          for round in $(seq 1 9); do
            ok=0
            for i in 1 2 3; do
              if curl -fsS --max-time 90 https://kitchen-calc.onrender.com/health; then
                echo; echo "$(date -u +%H:%M:%S) ok"; ok=1; break
              fi
              echo "попытка $i не удалась, повтор через 20 с"; sleep 20
            done
            [ "$ok" = 1 ] || failed=1
            [ "$round" = 9 ] || sleep 240
          done
          exit $failed
