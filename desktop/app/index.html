<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen Calc Studio</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Показывает ошибку прямо в окне, если программа не смогла запуститься (раньше, чем загрузится редактор)
    window.kcsFail = function (text) {
      var d = document.getElementById('kcsFail') || document.createElement('div');
      d.id = 'kcsFail';
      d.style.cssText = 'position:fixed;inset:auto 16px 40px 16px;z-index:999;background:#3a1714;color:#ffd9d2;border:1px solid #d9776a;border-radius:10px;padding:14px 16px;font:13px/1.5 Segoe UI,Arial,sans-serif;white-space:pre-wrap;user-select:text';
      d.textContent = 'Kitchen Calc Studio: ' + text + '\n\nСделайте снимок экрана с этим сообщением и пришлите его.';
      (document.body || document.documentElement).appendChild(d);
    };
    window.addEventListener('error', function (e) { window.kcsFail((e.message || 'ошибка') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
    window.addEventListener('unhandledrejection', function (e) { window.kcsFail(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
  </script>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/","three-mesh-bvh":"./vendor/three-mesh-bvh.module.js","three-bvh-csg":"./vendor/three-bvh-csg.module.js"}}</script>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><img src="../build/icon.png" alt=""><span>Kitchen Calc <b>Studio</b></span></div>
    <div class="tb-group">
      <button data-cmd="new" title="Новый проект (Ctrl+N)">Новый</button>
      <button data-cmd="open" title="Открыть (Ctrl+O)">Открыть</button>
      <button data-cmd="save" title="Сохранить (Ctrl+S)">Сохранить</button>
    </div>
    <div class="tb-group">
      <button data-cmd="room" title="Комната: форма, высота стен, окна, двери, колонны">🏠 Комната</button>
      <button class="accent" data-cmd="cabinet" title="Корпус из деталей: боковины, дно, крыша, задняя стенка, полки, фасады, ящики">＋ Корпус</button>
      <button data-cmd="panel-h" title="Горизонтальная деталь (полка, дно)">▭</button>
      <button data-cmd="panel-v" title="Вертикальная деталь (боковина, перегородка)">▯</button>
      <button data-cmd="panel-f" title="Фронтальная деталь (фасад, задняя стенка)">◻</button>
      <button data-cmd="appliances" title="Техника: холодильники, плиты, духовки, варочные панели, вытяжки, посудомоечные и стиральные машины, микроволновки, кофемашины, чайники, ТВ, кондиционеры, котлы — встраиваемая и отдельностоящая, с размерами и тем, как открывается">🔌 Техника</button>
    </div>
    <div class="tb-group">
      <button data-cmd="undo" title="Отменить (Ctrl+Z)">↶</button>
      <button data-cmd="redo" title="Повторить (Ctrl+Y)">↷</button>
      <button data-cmd="duplicate" title="Копия рядом (Ctrl+D)">Копия</button>
      <button data-cmd="delete" title="Удалить (Delete)">Удалить</button>
    </div>
    <div class="tb-group views">
      <button data-view="3d" class="on" title="Перспектива">3D</button>
      <button data-view="front" title="Вид спереди">Спереди</button>
      <button data-view="top" title="Вид сверху">Сверху</button>
      <button data-view="left" title="Вид слева">Слева</button>
      <button data-cmd="fit" title="Показать всё (F)">⤢</button>
      <button data-cmd="boxsel" title="Выделение рамкой (или Ctrl + тянуть мышью)">⬚</button>
      <button data-cmd="ruler" title="Линейка: расстояние, цепочка, угол, окружность, дуга, площадь, зазор">📏 Линейка</button>
    </div>
    <div class="tb-group">
      <label class="tb-chk" title="Когда открываете дверь или ящик, подходит человек, а соседка приходит ругаться. Без галочки — открывается само"><input type="checkbox" id="showPeople"> 👥 Люди</label>
      <button data-cmd="light" id="lightBtn" title="Включить / выключить свет">💡 Свет</button>
    </div>
    <div class="tb-group">
      <button data-cmd="paint" title="Материалы: ЛДСП, ЛМДФ, акрил, эмаль RAL, пол, стены — заливка кликом">🪣 Материалы</button>
      <button data-cmd="hw" title="Фурнитура для выбранной детали">Фурнитура</button>
      <button data-cmd="hw-toggle-all" title="Открыть или закрыть всё: двери, ящики, подъёмники, двери техники">▶ Действия</button>
      <button data-cmd="spec" title="Спецификация и раскрой">Спецификация</button>
      <button data-cmd="drawings" title="Без выбора — весь комплект: общий вид, каждый шкаф, каждая деталь. С выбором — выбранный шкаф или детали">Чертежи</button>
      <button data-cmd="shot" title="Сохранить картинку PNG (для ИИ-рендера)">PNG</button>
    </div>
  </header>
  <div class="tb-track" id="tbTrack"><div class="tb-thumb" id="tbThumb"></div></div>
  <button class="tb-arrow left" id="tbLeft" title="Прокрутить панель влево" hidden>‹</button>
  <button class="tb-arrow right" id="tbRight" title="Прокрутить панель вправо" hidden>›</button>

  <main class="layout">
    <aside class="side left">
      <h3>Проект</h3>
      <div id="tree" class="tree"></div>
    </aside>
    <section id="viewport" class="viewport">
      <div class="vp-hint" id="vpHint"></div>
    </section>
    <aside class="side right">
      <h3 id="inspTitle">Свойства</h3>
      <div id="inspector" class="inspector"></div>
    </aside>
  </main>

  <footer class="status">
    <span id="statusText">Готово</span>
    <span class="grow"></span>
    <label>Шаг <select id="gridStep"><option value="1">1 мм</option><option value="5">5 мм</option><option value="10" selected>10 мм</option><option value="50">50 мм</option><option value="100">100 мм</option></select></label>
    <label><input type="checkbox" id="magnet" checked> Магнит к деталям</label>
    <label title="Детали не входят друг в друга: упираются и встают вплотную"><input type="checkbox" id="noClash" checked> Не пересекать</label>
    <label title="Показывать конфирматы, полкодержатели и другой крепёж в отверстиях"><input type="checkbox" id="showFast" checked> Крепёж</label>
    <label><input type="checkbox" id="showDims" checked> Размеры</label>
    <label><input type="checkbox" id="showRoom" checked> Стены</label>
  </footer>

  <div class="modal" id="modal" hidden>
    <div class="dialog">
      <div class="dlg-head"><h2 id="dlgTitle"></h2><button class="x" data-close>×</button></div>
      <div class="dlg-body" id="dlgBody"></div>
      <div class="dlg-foot" id="dlgFoot"></div>
    </div>
  </div>

  <div id="printArea"></div>
  <input type="file" id="fileInput" accept=".kcp,.json" hidden>
  <script type="module" src="editor.js"></script>
</body>
</html>
